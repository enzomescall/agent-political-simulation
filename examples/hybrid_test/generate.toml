# Hybrid procedural generation configuration
# Explicit agents are defined in agents.toml
# Additional agents will be procedurally generated to fill the structure

# Use profile-based generation for quick setup
# profile = "federated" would generate a full federal structure
# Instead, let's use explicit configuration to demonstrate the flexibility

# Federal level configuration
[federal]
# Number of congressional seats to generate
num_congress = 12
# Election interval for federal elections
election_interval = 5

# State level configurations
[[states]]
state_id = "state_1"
# Governor party (if not specified, will be picked based on IG fit)
governor_party = "labor"
# Number of seats in state assembly
assembly_seats = 9
# Optional: explicit assembly composition (party_id -> seat count)
# If not specified, seats are distributed round-robin
[states.assembly_composition]
labor = 4
civic = 2
reform = 2
green = 1

[[states]]
state_id = "state_2"
governor_party = "reform"
assembly_seats = 7
[states.assembly_composition]
reform = 3
civic = 2
labor = 1
green = 1

# City/municipality level configurations
[[cities]]
city_id = "state_1_city_1"
council_seats = 5

[[cities]]
city_id = "state_1_city_2"
council_seats = 5

[[cities]]
city_id = "state_2_city_1"
council_seats = 5

# Random seed for reproducible generation
seed = 42
